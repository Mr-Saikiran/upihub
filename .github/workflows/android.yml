name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-screenshots
          path: |
            app/build/reports/
            app/build/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: upi-hub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    # Signed Play Store bundle for version tags, when the signing secrets exist.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPIHUB_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::UPIHUB_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB and APK
        env:
          UPIHUB_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPIHUB_KEYSTORE_PASSWORD: ${{ secrets.UPIHUB_KEYSTORE_PASSWORD }}
          UPIHUB_KEY_ALIAS: ${{ secrets.UPIHUB_KEY_ALIAS }}
          UPIHUB_KEY_PASSWORD: ${{ secrets.UPIHUB_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: upi-hub-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
