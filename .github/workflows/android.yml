name: Android

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  # "Run workflow" on master publishes a release for the current versionName.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-screenshots
          path: |
            app/build/reports/
            app/build/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: upi-hub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    # A version tag (v0.4.0, ...) or "Run workflow" on master builds the signed
    # APK and AAB and publishes a GitHub Release with the APK attached. Needs
    # the UPIHUB_* signing secrets.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Work out the release tag
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$version" || { echo "::error::versionName not found"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$version"
          else
            tag="$GITHUB_REF_NAME"
            test "v$version" = "$tag" || { echo "::error::Tag $tag does not match versionName $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPIHUB_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::UPIHUB_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB and APK
        env:
          UPIHUB_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPIHUB_KEYSTORE_PASSWORD: ${{ secrets.UPIHUB_KEYSTORE_PASSWORD }}
          UPIHUB_KEY_ALIAS: ${{ secrets.UPIHUB_KEY_ALIAS }}
          UPIHUB_KEY_PASSWORD: ${{ secrets.UPIHUB_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease
      - name: Collect release files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/techswitch-upihub-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/techswitch-upihub-$VERSION-playstore.aab"
          (cd dist && sha256sum * > SHA256SUMS)
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then cp "$notes" dist-notes.md; else echo "UPI Hub $TAG" > dist-notes.md; fi
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit when it does not exist yet.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: UPI Hub ${{ env.TAG }}
          body_path: dist-notes.md
          files: |
            dist/techswitch-upihub-*.apk
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: upi-hub-release
          path: dist/
